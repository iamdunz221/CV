<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2050" width="1200" height="2050" style="background-color: #FFFFFF;">
  <defs>
    <marker id="generalization" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <polygon points="0,0 16,8 0,16" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="2050" fill="#FFFFFF"/>

  <!-- System Boundary Container -->
  <g class="boundary">
    <!-- Main Box -->
    <rect x="310" y="50" width="460" height="1940" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
    <!-- Header Line -->
    <line x1="310" y1="94" x2="770" y2="94" stroke="#000000" stroke-width="2.5"/>
    <!-- Header Title -->
    <text x="540.0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      KIDPRO SYSTEM - SCHOOL MANAGEMENT &amp; PRINCIPAL
    </text>
  </g>

  <!-- Generalization Edge: User -> School Principal -->
  <line x1="110" y1="1070" x2="110" y2="1025" stroke="#000000" stroke-width="2" marker-end="url(#generalization)"/>

  <!-- Actors -->
  
    <!-- Actor: School Principal -->
    <g class="actor">
      <!-- Head -->
      <circle cx="110" cy="923.2" r="18.4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <!-- Body -->
      <line x1="110" y1="941.6" x2="110" y2="978.4" stroke="#000000" stroke-width="2"/>
      <!-- Arms -->
      <line x1="80.1" y1="953.1" x2="139.9" y2="953.1" stroke="#000000" stroke-width="2"/>
      <!-- Left Leg -->
      <line x1="110" y1="978.4" x2="84.7" y2="1012.9" stroke="#000000" stroke-width="2"/>
      <!-- Right Leg -->
      <line x1="110" y1="978.4" x2="135.3" y2="1012.9" stroke="#000000" stroke-width="2"/>
      <!-- Label -->
      <text x="110" y="1035.9" font-family="Helvetica, Arial, sans-serif" font-size="16.099999999999998" font-weight="bold" fill="#000000" text-anchor="middle">School Principal</text>
    </g>
    
  
    <!-- Actor: User -->
    <g class="actor">
      <!-- Head -->
      <circle cx="110" cy="1083.2" r="18.4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <!-- Body -->
      <line x1="110" y1="1101.6" x2="110" y2="1138.4" stroke="#000000" stroke-width="2"/>
      <!-- Arms -->
      <line x1="80.1" y1="1113.1" x2="139.9" y2="1113.1" stroke="#000000" stroke-width="2"/>
      <!-- Left Leg -->
      <line x1="110" y1="1138.4" x2="84.7" y2="1172.9" stroke="#000000" stroke-width="2"/>
      <!-- Right Leg -->
      <line x1="110" y1="1138.4" x2="135.3" y2="1172.9" stroke="#000000" stroke-width="2"/>
      <!-- Label -->
      <text x="110" y="1195.9" font-family="Helvetica, Arial, sans-serif" font-size="16.099999999999998" font-weight="bold" fill="#000000" text-anchor="middle">User</text>
    </g>
    
  
    <!-- Actor: Push Notification (FCM) -->
    <g class="actor">
      <!-- Head -->
      <circle cx="990" cy="1794.2" r="18.4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <!-- Body -->
      <line x1="990" y1="1812.6" x2="990" y2="1849.4" stroke="#000000" stroke-width="2"/>
      <!-- Arms -->
      <line x1="960.1" y1="1824.1" x2="1019.9" y2="1824.1" stroke="#000000" stroke-width="2"/>
