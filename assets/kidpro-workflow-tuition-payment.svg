<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 680" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="2370" height="650" fill="#ffffff" stroke="#111827" stroke-width="2.5" />

  <!-- Left Header Lane Separator -->
  <line x1="50" y1="15" x2="50" y2="665" stroke="#111827" stroke-width="2" />

  <!-- Horizontal Swimlane Dividers -->
  <!-- Divider 1: Parent App / Accountant -->
  <line x1="15" y1="165" x2="2385" y2="165" stroke="#111827" stroke-width="2" />
  <!-- Divider 2: Accountant / Payment Process System -->
  <line x1="15" y1="310" x2="2385" y2="310" stroke="#111827" stroke-width="2" />
  <!-- Divider 3: Payment Process System / Payment Gateway -->
  <line x1="15" y1="545" x2="2385" y2="545" stroke="#111827" stroke-width="2" />

  <!-- Vertical Lane Header Labels -->
  <text x="35" y="90" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90, 35, 90)">Parent App</text>
  <text x="35" y="238" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90, 35, 238)">Accountant</text>
  <text x="35" y="428" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90, 35, 428)">Payment Process System</text>
  <text x="35" y="605" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90, 35, 605)">Payment Gateway</text>

  <!-- ==================== NODES ==================== -->

  <!-- LANE 2: ACCOUNTANT -->
  <!-- Start Event -->
  <circle cx="95" cy="235" r="14" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- Node 1 -->
  <rect x="145" y="205" width="165" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="227.5" y="232" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">1. Request Tuition</text>
  <text x="227.5" y="250" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Statement Generation</text>

  <!-- Node 4 -->
  <rect x="355" y="205" width="165" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="437.5" y="232" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">4. Appraisal &amp; Approve</text>
  <text x="437.5" y="250" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Bulk Listings</text>

  <!-- Node 17B -->
  <rect x="1690" y="205" width="165" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1772.5" y="232" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">17B. Manual</text>
  <text x="1772.5" y="250" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Reconciliation</text>

  <!-- LANE 1: PARENT APP -->
  <!-- Node 7 -->
  <rect x="645" y="60" width="180" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="735" y="87" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">7. Receive Notification</text>
  <text x="735" y="105" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">&amp; View Invoice Details</text>

  <!-- Node 8 -->
  <rect x="865" y="60" width="150" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="940" y="87" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">8. Open VietQR</text>
  <text x="940" y="105" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Code</text>

  <!-- Node 11 -->
  <rect x="1055" y="60" width="160" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1135" y="87" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">11. Scan &amp; Confirm</text>
  <text x="1135" y="105" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transfer</text>

  <!-- Node 19 -->
  <rect x="2100" y="60" width="165" height="60" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="2182.5" y="87" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">19. Receive Payment</text>
  <text x="2182.5" y="105" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Notifications</text>

  <!-- End Event (Bullseye) -->
  <circle cx="2330" cy="90" r="16" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <circle cx="2330" cy="90" r="10" fill="#111827" />

  <!-- LANE 3: PAYMENT PROCESS SYSTEM -->
  <!-- Node 2 -->
  <rect x="145" y="355" width="165" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="227.5" y="379" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">2. Save Request &amp;</text>
  <text x="227.5" y="397" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Init Process</text>

  <!-- Node 3 -->
  <rect x="350" y="355" width="175" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="437.5" y="379" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">3. Summary Data &amp;</text>
  <text x="437.5" y="397" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Create Draft Invoices</text>

  <!-- Node 5 -->
  <rect x="460" y="465" width="160" height="50" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="540" y="488" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">5. Update Status =</text>
  <text x="540" y="504" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">APPROVED</text>

  <!-- Node 6 -->
  <rect x="650" y="355" width="175" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="737.5" y="379" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">6. Publish Invoice &amp;</text>
  <text x="737.5" y="397" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Send Notifications</text>

  <!-- Node 9 -->
  <rect x="790" y="435" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="875" y="467" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">9. Log Payment Intent</text>

  <!-- Node 10 -->
  <rect x="980" y="355" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1065" y="379" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">10. Generate Dynamic</text>
  <text x="1065" y="397" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">VietQR String</text>

  <!-- Node 14 -->
  <rect x="1415" y="435" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1500" y="459" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">14. Receive Payment</text>
  <text x="1500" y="477" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Webhook</text>

  <!-- Node 15 Decision Diamond -->
  <polygon points="1690,432 1755,462.5 1690,493 1625,462.5" fill="#fef08a" stroke="#dc2626" stroke-width="2.5" />
  <text x="1690" y="467" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">15. Exact Match?</text>

  <!-- Node 16B -->
  <rect x="1615" y="345" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1700" y="369" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">16B. Log Mismatch &amp;</text>
  <text x="1700" y="387" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Alert Accountant</text>

  <!-- Node 18B -->
  <rect x="1870" y="345" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1955" y="369" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">18B. Update Manual</text>
  <text x="1955" y="387" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Resolution Record</text>

  <!-- Node 16 -->
  <rect x="1840" y="435" width="170" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1925" y="459" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">16. Instant Debt Crossing</text>
  <text x="1925" y="477" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">&amp; Issue Receipt</text>

  <!-- Node 17 -->
  <rect x="2070" y="435" width="160" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="2150" y="459" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">17. Update Status =</text>
  <text x="2150" y="477" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">PAID</text>

  <!-- LANE 4: PAYMENT GATEWAY -->
  <!-- Node 12 -->
  <rect x="1185" y="580" width="165" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1267.5" y="604" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">12. Process Money</text>
  <text x="1267.5" y="622" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transfer</text>

  <!-- Node 13 -->
  <rect x="1420" y="580" width="155" height="55" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
  <text x="1497.5" y="613" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">13. Fire Webhook</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->

  <!-- Start -> Node 1 (red arrow) -->
  <line x1="109" y1="235" x2="143" y2="235" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Node 1 -> Node 2 (solid downward arrow) -->
  <line x1="227.5" y1="265" x2="227.5" y2="353" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 2 -> Node 3 -->
  <line x1="310" y1="382.5" x2="348" y2="382.5" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 3 -> Node 4 (arrow up with draft list text) -->
  <line x1="437.5" y1="355" x2="437.5" y2="267" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="455" y="325" font-size="11" font-weight="600" fill="#374151">draft list</text>

  <!-- Node 4 -> Node 5 -->
  <path d="M 520 235 L 540 235 L 540 463" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 5 -> Node 6 -->
  <path d="M 620 490 L 737.5 490 L 737.5 412" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 6 -> Node 7 -->
  <line x1="737.5" y1="355" x2="737.5" y2="122" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 7 -> Node 8 -->
  <line x1="825" y1="90" x2="863" y2="90" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 8 -> Node 9 -->
  <path d="M 940 120 L 940 370 L 875 370 L 875 433" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 9 -> Node 10 -->
  <path d="M 960 462.5 L 1065 462.5 L 1065 412" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 10 -> Node 11 -->
  <path d="M 1065 355 L 1065 240 L 1135 240 L 1135 122" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 11 -> Node 12 (long line down to lane 4) -->
  <path d="M 1215 90 L 1267.5 90 L 1267.5 578" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 12 -> Node 13 -->
  <line x1="1350" y1="607.5" x2="1418" y2="607.5" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 13 -> Node 14 -->
  <path d="M 1500 580 L 1500 492" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 14 -> Diamond 15 -->
  <line x1="1585" y1="462.5" x2="1623" y2="462.5" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Diamond 15 -> Node 16 (Yes) -->
  <line x1="1755" y1="462.5" x2="1838" y2="462.5" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1780" y="455" font-size="12" font-weight="700" fill="#15803d">Yes</text>

  <!-- Diamond 15 -> Node 16B (No) -->
  <line x1="1690" y1="432" x2="1690" y2="402" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1698" y="420" font-size="12" font-weight="700" fill="#b91c1c">No</text>

  <!-- Node 16B -> Node 17B -->
  <path d="M 1700 345 L 1700 290 L 1772.5 290 L 1772.5 267" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 17B -> Node 18B -->
  <path d="M 1855 235 L 1955 235 L 1955 343" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 16 -> Node 17 -->
  <line x1="2010" y1="462.5" x2="2068" y2="462.5" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 18B -> Node 19 -->
  <path d="M 2040 372.5 L 2060 372.5 L 2060 90 L 2098 90" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 17 -> Node 19 -->
  <path d="M 2150 435 L 2150 122" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 19 -> End Event -->
  <line x1="2265" y1="90" x2="2312" y2="90" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

</svg>